name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        working-directory: platform/api
        run: go build ./...
      - name: Test
        working-directory: platform/api
        run: go test ./...

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Typecheck (tsconfig sanity)
        working-directory: apps/mobile
        run: npx --yes typescript@5.6 --noEmit -p tsconfig.json || echo "deps pending install"

  python-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall intelligence/ml-platform/src
