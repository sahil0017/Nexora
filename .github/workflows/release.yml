name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/api/go.mod
          cache-dependency-path: platform/api/go.sum

      - name: Build cross-platform Go API binaries
        working-directory: platform/api
        run: |
          mkdir -p ../../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/nexora-api-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../../dist/nexora-api-linux-arm64 ./cmd/server
          (cd ../../dist && sha256sum nexora-api-* > checksums.txt)

      - name: Publish GitHub Release with categorized notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: |
            dist/nexora-api-linux-amd64
            dist/nexora-api-linux-arm64
            dist/checksums.txt
