name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-go:
    name: Build Go API Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: platform/api/go.mod
          cache-dependency-path: platform/api/go.sum

      - name: Build cross-platform Go API binaries
        working-directory: platform/api
        run: |
          mkdir -p ../../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/nexora-api-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../../dist/nexora-api-linux-arm64 ./cmd/server
          (cd ../../dist && sha256sum nexora-api-* > checksums.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: go-dist
          path: dist/*

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Generate native Android project via Expo prebuild
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../../../dist-apk
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" ../../../dist-apk/nexora-mobile-android.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist-apk/nexora-mobile-android.apk

  release:
    name: Create GitHub Release
    needs: [build-go, build-android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: go-dist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: dist

      - name: Publish GitHub Release with APK and Go binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: |
            dist/nexora-api-linux-amd64
            dist/nexora-api-linux-arm64
            dist/checksums.txt
            dist/nexora-mobile-android.apk
