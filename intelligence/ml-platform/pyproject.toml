[project]
name = "nexora-ml"
version = "0.1.0"
description = "NEXORA intelligence service: prediction models and inference API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "torch>=2.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
